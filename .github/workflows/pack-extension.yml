name: Pack Firefox Extension

on:
  push:
    branches:
      - main
    paths:
      - 'firefox-extension/**'
  workflow_dispatch:

jobs:
  pack-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Build and Pack Extension
        run: |
          cd firefox-extension
          web-ext build --filename="otosu-extension-{version}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension-zip
          path: firefox-extension/web-ext-artifacts/otosu-extension-*.zip
